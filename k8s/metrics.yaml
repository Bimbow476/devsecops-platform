apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics
  namespace: devsecops
  labels:
    app: metrics
    app.kubernetes.io/part-of: devsecops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics
  template:
    metadata:
      labels:
        app: metrics
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: metrics
          image: devsecops-platform-metrics:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PORT
              value: "8081"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: metrics
  namespace: devsecops
  labels:
    app: metrics
spec:
  selector:
    app: metrics
  ports:
    - name: http
      port: 8081
      targetPort: 8081