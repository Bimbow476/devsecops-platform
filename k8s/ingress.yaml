# Додатковий вхід через nginx ingress (minikube addons enable ingress).
# Для доступу додайте у /etc/hosts (Windows: C:\Windows\System32\drivers\etc\hosts):
#   192.168.49.2  dashboard.local
# Альтернатива без ingress:  minikube service frontend -n devsecops
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ingress
  namespace: devsecops
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
    - host: dashboard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80