name: CD

on:
  workflow_dispatch:
  # CD запускається після успішного CI. Запуск на push безпосередньо
  # створює гонку: образи з SHA ще можуть бути не опубліковані в GHCR.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Один Minikube-деплой за раз. Не скасовуємо активний rollout автоматично,
# щоб новий commit не зупиняв уже розгорнуті ресурси на півдорозі.
concurrency:
  group: cd-minikube-${{ github.repository }}
  cancel-in-progress: false

# ВАЖЛИВО: GitHub-hosted runners не мають доступу до локального Minikube.
# Цей воркфлоу виконується на self-hosted runner з міткою `minikube`
# (див. SETUP.md -> Реєстрація self-hosted runner).
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: Deploy to Minikube (self-hosted)
    runs-on: [self-hosted, linux, x64, minikube]
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      REGISTRY: ghcr.io
      NAMESPACE: devsecops
      # Для workflow_run потрібний SHA саме того CI-run, який завершився успішно.
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Verify successful CI for exact commit
        # workflow_run already carries a successful CI conclusion. A manual
        # dispatch must independently prove that the exact main SHA passed CI;
        # otherwise an unpublished SHA tag could be sent to the cluster.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&status=completed&per_page=100")"
          if ! printf '%s' "$response" | tr -d '[:space:]' | grep -q '"conclusion":"success"'; then
            echo "::error::No successful CI run found for exact SHA ${DEPLOY_SHA}"
            exit 1
          fi

      - name: Verify cluster connection
        run: |
          kubectl config current-context
          kubectl get nodes -o wide

      - name: Refuse unsafe emptyDir-to-PVC switch
        run: |
          chmod +x ./scripts/k8s-preflight.sh
          NAMESPACE="${NAMESPACE}" ./scripts/k8s-preflight.sh
        shell: bash

      - name: Preflight published GHCR image manifests
        # Do not mutate the cluster until every exact SHA tag is already in the
        # registry. This also closes the small publication-propagation window
        # after a successful CI run.
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GHCR_USERNAME}" || -z "${GHCR_TOKEN}" ]]; then
            echo "::error::Configure repository secrets GHCR_PULL_USERNAME and GHCR_PULL_TOKEN for private GHCR pulls"
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY##*/}"
          repo="${repo,,}"
          digest_file="${RUNNER_TEMP}/devsecops-image-digests.txt"
          rm -f "$digest_file"
          : > "$digest_file"
          for svc in gateway metrics data frontend dota; do
            image="ghcr.io/${owner}/${repo}-${svc}:sha-${DEPLOY_SHA}"
            echo "==> preflight ${image}"
            headers="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 \
              --user "${GHCR_USERNAME}:${GHCR_TOKEN}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              --head "https://ghcr.io/v2/${owner}/${repo}-${svc}/manifests/sha-${DEPLOY_SHA}")"
            digest="$(printf '%s' "$headers" | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }' | tail -n 1)"
            if [[ ! "${digest}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
              echo "::error::Registry did not return a valid immutable digest for ${image}"
              exit 1
            fi
            printf '%s\n' "${digest,,}" >> "$digest_file"
          done

      - name: Capture current deployment images
        # Зберігаємо попередні SHA-образи до apply маніфестів, щоб rollback
        # не повертав deployment-и до локального тегу :local.
        shell: bash
        run: |
          set -euo pipefail
          backup_file="${RUNNER_TEMP}/devsecops-original-images.txt"
          rm -f "$backup_file"
          : > "$backup_file"
          complete=true
          for svc in gateway metrics data frontend dota; do
            image="$(kubectl -n "${{ env.NAMESPACE }}" get deployment "$svc" \
              -o jsonpath="{.spec.template.spec.containers[?(@.name==\"${svc}\")].image}" \
              2>/dev/null || true)"
            if [[ -z "$image" ]]; then
              complete=false
              break
            fi
            printf '%s\n' "$image" >> "$backup_file"
          done
          if [[ "$complete" != true ]]; then
            rm -f "$backup_file"
          fi

      - name: Configure GHCR image pull credentials
        # GHCR packages are kept private by default. Use a long-lived token
        # from repository secrets (GITHUB_TOKEN expires and would make future
        # kubelet pulls fail); never write the token to the repository or logs.
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GHCR_USERNAME}" || -z "${GHCR_TOKEN}" ]]; then
            echo "::error::Configure repository secrets GHCR_PULL_USERNAME and GHCR_PULL_TOKEN for private GHCR pulls"
            exit 1
          fi
          kubectl apply -f k8s/namespace.yaml
          kubectl -n "${{ env.NAMESPACE }}" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${GHCR_USERNAME}" \
            --docker-password="${GHCR_TOKEN}" \
            --type=kubernetes.io/dockerconfigjson \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        # Порядок важливий: спершу apply, потім set image. Якщо зробити навпаки,
        # kubectl apply перезапише image на локальний тег :local з маніфестів
        # (3-way merge повертає поле до значення з маніфесту).
        run: |
          kubectl apply -f k8s/

      - name: Update images to current commit (override :local)
        env:
          IMAGE_PULL_SECRET: ghcr-pull
        run: |
          set -euo pipefail
          chmod +x ./scripts/k8s-update-images.sh
          echo "Deploying exact image digests for ${DEPLOY_SHA}"
          export IMAGE_DIGEST_FILE="${RUNNER_TEMP}/devsecops-image-digests.txt"
          backup_file="${RUNNER_TEMP}/devsecops-original-images.txt"
          if [[ -f "$backup_file" ]]; then
            ./scripts/k8s-update-images.sh "${DEPLOY_SHA}" "$backup_file"
          else
            ./scripts/k8s-update-images.sh "${DEPLOY_SHA}"
          fi
        shell: bash

      - name: Show deployment status
        run: |
          kubectl get deployments -n "${{ env.NAMESPACE }}" -o wide
          kubectl get pods -n "${{ env.NAMESPACE }}" -o wide
