name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ---------- Збірка, тести та SCA-аудит залежностей ----------
  build-test:
    name: Build & test (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [services/gateway, services/metrics, services/data, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: Typecheck & build
        working-directory: ${{ matrix.dir }}
        run: npm run build

      - name: Run tests
        working-directory: ${{ matrix.dir }}
        run: npm test

      # Shift-left: сканування вразливостей залежностей у CI
      - name: Dependency vulnerability audit (npm audit)
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=high

  # ---------- Збірка Docker-образів, сканування Trivy та публікація в GHCR ----------
  docker:
    name: Build & publish image (${{ matrix.service }})
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, metrics, data, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: echo "name=${{ env.IMAGE_PREFIX }}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      # context: frontend знаходиться в корені, сервіси — у services/<name>
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Shift-left: сканування готового образу на CVE (провал при CRITICAL/HIGH)
      - name: Image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH